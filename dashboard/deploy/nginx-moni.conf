# MONI admin dashboard — TLS termination and reverse proxy.
#
# Port 80 here serves ONLY the ACME http-01 challenge for certificate renewal.
# It deliberately does not proxy the dashboard, leaving 80 free for other
# services later (add them as separate server blocks / locations).

limit_req_zone $binary_remote_addr zone=moni_login:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vmi3567127.contaboserver.net;

    # Let's Encrypt renewal challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}

server {
    # nginx 1.24 (Ubuntu 24.04) uses the `listen ... http2` form; the standalone
    # `http2 on;` directive only exists from nginx 1.25.1.
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name vmi3567127.contaboserver.net;

    ssl_certificate     /etc/letsencrypt/live/vmi3567127.contaboserver.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmi3567127.contaboserver.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MoniSSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Do not advertise the nginx version to scanners.
    server_tokens off;

    client_max_body_size 128k;

    access_log /var/log/nginx/moni-access.log;
    error_log  /var/log/nginx/moni-error.log;

    # Rate-limit the endpoints that accept credentials. burst allows a few
    # legitimate retries (mistyped TOTP) without tripping.
    location = /login {
        limit_req zone=moni_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/moni-proxy-params;
    }

    location = /pair {
        limit_req zone=moni_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/moni-proxy-params;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/moni-proxy-params;
    }
}
