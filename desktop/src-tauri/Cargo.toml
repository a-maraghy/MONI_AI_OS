[package]
name = "mint-desktop"
version = "0.1.4"
description = "MINT AI on the Windows desktop"
authors = ["Mint OS"]
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
name = "mint_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "mint-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
# Laptop control (machine/): the link to Mint OS (WebSocket over rustls, the Windows trust store) and the pairing POST.
tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
# Laptop control (hands/docs.rs): docx / xlsx / pptx are written as OOXML zips.
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Power",
  "Win32_System_Com",
  "Win32_System_SystemServices",
  "Win32_System_StationsAndDesktops",
  # Laptop control (machine/): the link token in Credential Manager, the CLI's process tree in a Job Object.
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
