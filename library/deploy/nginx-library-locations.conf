# MINT Library locations shared by the production server block (library.mint-stack.com) and the
# scratch test server. The production server block also has root, the /_store/ alias and TLS.
# Needs `upstream mint_library` (127.0.0.1:8795) and `limit_req_zone ... zone=library_login`.

# Hidden files (.moved markers, .tmp- writes, .lock) are never served.
location ~ /\. { return 404; }

# The service: view counts (public) and the studio API (signed in).
location ^~ /api/ {
    client_max_body_size 16m;
    proxy_pass http://mint_library;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
location = /api/studio/login {
    limit_req zone=library_login burst=10 nodelay;
    client_max_body_size 16k;
    proxy_pass http://mint_library;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# The studio pages and its media (any visibility; the service checks the session, then hands
# the file back to nginx with X-Accel-Redirect).
location = /studio { return 301 /studio/; }
location ^~ /studio/ {
    client_max_body_size 16k;
    proxy_pass http://mint_library;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# Media of public and unlisted videos: static, cacheable, embeddable.
location ~* \.(mp4|webm|jpg|jpeg|png|webp|vtt)$ {
    add_header Cache-Control "public, max-age=86400";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
}
# Asset URLs carry a content hash (?v=), so they can be cached for good.
location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
}
# A folder URL answers with its index.html or 404, never 403, so /u/ and /u/<token>/ reveal nothing.
location ~ /$ {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files ${uri}index.html =404;
}
location / {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/index.html $uri.html =404;
}
