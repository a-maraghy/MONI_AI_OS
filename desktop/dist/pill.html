<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MINT AI is controlling this computer</title>
<link rel="stylesheet" href="pill.css">
<script src="pill.js" defer></script>
</head>
<body>
<div class="pill" role="status" aria-live="polite">
  <span class="dot" aria-hidden="true"></span>
  <b>MINT AI is controlling</b>
  <span class="sep">·</span>
  <span><span id="left">--:--</span> left</span>
  <button type="button" id="more" title="Give MINT AI 15 more minutes">+15 min</button>
  <button type="button" id="stop" class="stop" title="Stop now: MINT AI lets go at once">Stop</button>
  <span class="key" id="key">Ctrl+Alt+Esc</span>
</div>
</body>
</html>
